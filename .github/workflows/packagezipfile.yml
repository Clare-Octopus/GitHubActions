steps:
  - uses: actions/checkout@v3

  # create a Zip package from files in the "reports" folder; create package in "packaging" folder
  - name: Create a Zip package 🐙
    uses: OctopusDeploy/create-zip-package-action@v3
    with:
      package_id: 'DemoPackage'
      version: '1.0.0'
      output_folder: './packagesoutput'
      base_path: packages
      files: |
        **/*.*

steps:
  - uses: actions/checkout@v3

  - name: Push a package to Octopus Deploy 🐙
    id: push_a_package_to_octopus_deploy
    uses: OctopusDeploy/push-package-action@v4
    env:
      OCTOPUS_URL: ${{ secrets.SERVER }}
      OCTOPUS_API_KEY: ${{ secrets.API_KEY }}
      OCTOPUS_SPACE: 'Default'
    with:
      packages: |
        package1.tar.gz
        package2.zip
        packages/**/*.zip
