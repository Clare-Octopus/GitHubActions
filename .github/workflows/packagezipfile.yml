name: Build and Push to Octopus

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  OCTOPUS_SERVER: https://octopus-operations.octopus.app/
  PACKAGE_ID: MyApplication
  PACKAGE_VERSION: 1.0.${{ github.run_number }}

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application
        run: |
          # Your build commands here
          # Example:
          # dotnet publish ./src/MyApplication \
          #   --configuration Release \
          #   --output ./publish

      - name: Login to Octopus
        uses: OctopusDeploy/login@v2
        with:
          server: ${{ env.OCTOPUS_SERVER }}
          service_account_id: 5e39c960-9e2c-44c5-bd84-a9651dc47cfc

      - name: Create ZIP package
        uses: OctopusDeploy/create-zip-package-action@v3
        with:
          package_id: ${{ env.PACKAGE_ID }}
          version: ${{ env.PACKAGE_VERSION }}
          output_folder: ./packages
          base_path: ./publish
          files: |
            **/*.*

      - name: Push package to Octopus
        uses: OctopusDeploy/push-package-action@v3
        with:
          packages: |
            ./packages/*.zip
