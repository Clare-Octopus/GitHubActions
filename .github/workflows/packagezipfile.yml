name: Build and Push Package to Octopus

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  OCTOPUS_SERVER: https://octopus-operations.octopus.app
  OCTOPUS_SPACE: Clare

  PACKAGE_ID: MyApplication
  PACKAGE_VERSION: 1.0.${{ github.run_number }}

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Get Octopus OIDC token
        id: oidc
        shell: bash
        env:
          AUDIENCE: 5e39c960-9e2c-44c5-bd84-a9651dc47cfc
        run: |
          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" \
            | jq -r '.value')

          echo "::add-mask::$TOKEN"

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null)

          echo "OIDC token claims:"
          echo "$PAYLOAD" | jq '{
            iss,
            sub,
            aud,
            repository,
            repository_owner,
            ref,
            event_name
          }'

      # Authenticate to Octopus using GitHub's OIDC token.
      # No Octopus API key is stored in GitHub.
      - name: Login to Octopus
        uses: OctopusDeploy/login@34b6dcc1e86fa373c14e6a28c5507d221e4de629 # v1.0.2
        with:
       server: ${{ env.OCTOPUS_SERVER }}
       service_account_id: 5e39c960-9e2c-44c5-bd84-a9651dc47cfc

      - name: Create ZIP package
        uses: OctopusDeploy/create-zip-package-action@v3
        with:
          package_id: ${{ env.PACKAGE_ID }}
          version: ${{ env.PACKAGE_VERSION }}
          output_folder: ./packages
          base_path: ./src/MyApplication
          files: |
            **/*.*

      - name: Push package to Octopus
        uses: OctopusDeploy/push-package-action@v3
        with:
          packages: |
            ./packages/*.zip
