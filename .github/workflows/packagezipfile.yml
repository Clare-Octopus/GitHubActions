on:
  push:
    branches: 
      - master
      - test
      - main
env:  
  OCTOPUS_SPACE_NAME: Clare
  OCTOPUS_SPACE: 'Clare'
  PACKAGE_VERSION: 1.0.0

jobs:
 build:
   name: Push Package and Create Release
   runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v3

  # create a Zip package from files in the "reports" folder; create package in "packaging" folder
  - name: Create a Zip package 🐙
    id: create_a_zip_package
    uses: OctopusDeploy/create-zip-package-action@v4
    with:
      package_id: 'DemoPackage'
      version: '1.0.0'
      output_folder: './packagesoutput'
      base_path: packages
      files: |
        **/*.*

steps:
  - uses: actions/checkout@v3

  - name: Push a package to Octopus Deploy 🐙
    id: push_a_package_to_octopus_deploy
    uses: OctopusDeploy/push-package-action@v4
    env:
      OCTOPUS_URL: ${{ secrets.OCTOPUSCLOUDURL }}
      OCTOPUS_API_KEY: ${{ secrets.OCTOPUSCLOUDAPI }}
      OCTOPUS_SPACE: 'Clare'
    with:
      packages: |
        DemoPackage.1.0.0.zip
