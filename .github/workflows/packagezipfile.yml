name: Hello Octopus Packages

on:
  push:
    branches: 
      - master
      - test
      - main

jobs:
  octopus-packages:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required by login action

    env:
      OCTOPUS_SPACE: 'Clare'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Action to log into Octopus Deploy
      - name: Log into Octopus Deploy 🐙
        uses: OctopusDeploy/login@v1
        with: 
          server: ${{ secrets.OCTOPUSCLOUDURL }}
          service_account_id: Users-2641
      
      # Action to Create a Zip Package
      - name: Create a Zip package 🐙
        uses: OctopusDeploy/create-zip-package-action@v3
        with:
          package_id: 'DemoPackage'
          version: '1.0.0'
          output_folder: './packages/'
          base_path: './packagesoutput/'
          files: |
            **/*.*
      
      # Action to Push Packages to Octopus Deploy
      - name: Push a package to Octopus Deploy 🐙
        uses: OctopusDeploy/push-package-action@v3
        with:
          packages: |
            packages/**/*.zip
